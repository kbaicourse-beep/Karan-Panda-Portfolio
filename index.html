<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karan Panda — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  /* First-visit-only greeting intro (see js/intro.js). Runs before paint
     so the hero name + rest of the page stay hidden with no flash of
     content, until the animation reveals them. Skipped entirely on
     repeat visits and for reduced-motion users. A safety timeout further
     down guarantees the page is never stuck hidden if intro.js fails to
     load. */
  (function () {
    try {
      var seen = localStorage.getItem("kp_intro_seen");
      var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!seen && !reduced) {
        document.documentElement.classList.add("intro-pending");
      }
    } catch (e) {}
  })();
</script>
</head>
<body id="top">
<script>
  // Safety net: if intro.js never runs (blocked, fails to load, etc.),
  // never leave the page permanently hidden.
  setTimeout(function () {
    document.documentElement.classList.remove("intro-pending");
    document.documentElement.classList.add("intro-revealing");
  }, 7000);
</script>
